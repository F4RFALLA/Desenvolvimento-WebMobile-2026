<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg app-navbar border-bottom">
    <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand fw-bold app-brand" href="{% url 'home' %}">Veículos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'listar-veiculos' %}active{% endif %}" href="{% url 'listar-veiculos' %}">Inventory</a>
                </li>
            </ul>
            {% if request.user.is_authenticated %}
            <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                <span class="app-user">{{ request.user.username }}</span>
                <a class="btn btn-sm btn-outline-dark rounded-0 px-3" href="{% url 'logout' %}">Sair</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container-fluid px-4 px-lg-5 py-4 py-lg-5">
    {% block content %}{% endblock %}
</main>

</body>
</html>
